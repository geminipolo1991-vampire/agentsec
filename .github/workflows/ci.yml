name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packaging toolchain
        run: python -m pip install --upgrade pip "setuptools>=58"
      - run: python -m pip install -e .
      - run: make verify
